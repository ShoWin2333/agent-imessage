name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/dsh-plugin-a61b

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm pack --dry-run --ignore-scripts

  profile:
    name: Packed DSH profile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # pnpm/action-setup remains the supported action for the pinned pnpm 10 line.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run build
      # dsh@rc.6 currently resolves dsh-app-boot@rc.7 through its own caret.
      # Those two boot dependencies are peer-only there, so name them explicitly
      # in the disposable CLI used solely for packed-profile validation.
      - name: Install isolated DSH rc.6 smoke CLI
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-rc6"
          @deepseek-ai/dsh@0.1.0-rc.6
          @deepseek-ai/cordis-plugin-group@^1.0.1
          @deepseek-ai/dsh-invariants@^0.1.0-rc.6
          --legacy-peer-deps --ignore-scripts
      - name: Install packed plugin into a disposable web profile
        run: DSH_BIN="$RUNNER_TEMP/dsh-rc6/node_modules/.bin/dsh" npm run test:profile
